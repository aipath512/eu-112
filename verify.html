<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification d'accès — EU-112</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://eu-112.eu/verify.html">
<style>
  :root{
    --bg:#0a0a0a; --gold:#f0c14b; --text:#eeeeee; --dim:#b8b3a4;
    --err:#ff6b6b; --ok:#6bcf8a;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:var(--sans); display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{max-width:440px; width:100%; text-align:center}
  h1{font-family:var(--serif); font-size:24px; font-weight:600; margin:0 0 6px}
  h1 em{color:var(--gold); font-style:italic}
  .sub{color:var(--dim); font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:34px}
  p{color:var(--dim); font-size:14.5px; line-height:1.65; margin:0 0 18px}
  .btn{
    display:inline-block; background:var(--gold); color:#0a0a0a; border:0;
    padding:13px 26px; border-radius:6px; font-size:15px; font-weight:600;
    font-family:var(--sans); cursor:pointer; text-decoration:none;
  }
  .btn:disabled{opacity:.55; cursor:default}
  .btn-sec{
    display:inline-block; margin-top:14px; background:transparent; color:var(--dim);
    border:1px solid #333; padding:11px 22px; border-radius:6px; font-size:14px; text-decoration:none;
  }
  .err{color:var(--err)}
  .ok{color:var(--ok)}
  .mail{color:var(--text); font-weight:600}
  .spin{
    display:inline-block; width:13px; height:13px; margin-right:8px; vertical-align:-2px;
    border:2px solid #444; border-top-color:var(--gold); border-radius:50%;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <h1>EU-<em>112</em></h1>
    <div class="sub">Espace Partenaire</div>

    <div id="status">
      <p>Cliquez sur le bouton ci-dessous pour finaliser votre connexion.</p>
    </div>

    <div id="actions">
      <button type="button" class="btn" id="confirm">Confirmer mon accès →</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var API = "https://eu-112-partner-api.aipath512.workers.dev";

  // Clés distinctes de celles du site roumain — un même navigateur peut
  // être connecté aux deux sans que les sessions se mélangent.
  var SESSION_KEY = "eu112_session";
  var EMAIL_KEY   = "eu112_email";

  var statusEl  = document.getElementById("status");
  var actionsEl = document.getElementById("actions");
  var confirmBtn= document.getElementById("confirm");
  var token = new URLSearchParams(window.location.search).get("token");

  function backLink() {
    return '<a href="/" class="btn-sec">Retour à l\'accueil</a>';
  }

  if (!token) {
    statusEl.innerHTML = '<p class="err">Lien invalide — le jeton est absent.</p>';
    actionsEl.innerHTML = backLink();
    return;
  }

  // Le vrai appel /auth/verify ne part QUE sur un clic humain.
  // Les scanners de sécurité des messageries (Gmail, Outlook Safe Links,
  // passerelles d'entreprise) préchargent les liens d'un e-mail pour les
  // analyser, mais n'exécutent pas de JavaScript et ne cliquent pas.
  // Sans ce garde-fou, le jeton à usage unique serait consommé avant même
  // que la personne ouvre son message.
  confirmBtn.addEventListener("click", function () {
    confirmBtn.disabled = true;
    statusEl.innerHTML = '<p><span class="spin"></span>Vérification du lien…</p>';

    fetch(API + "/auth/verify?token=" + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok || !data.sessionToken) {
          statusEl.innerHTML = '<p class="err">' + (data.error || "Le lien n'a pas pu être vérifié.") + "</p>";
          actionsEl.innerHTML = backLink();
          return;
        }

        localStorage.setItem(SESSION_KEY, data.sessionToken);
        localStorage.setItem(EMAIL_KEY, data.email);

        var mail = String(data.email).replace(/</g, "&lt;");

        if (data.onboarded) {
          statusEl.innerHTML =
            '<p class="ok">Connecté en tant que <span class="mail">' + mail + "</span>.</p>";
          actionsEl.innerHTML =
            '<a href="/espace.html" class="btn">Accéder à mon espace →</a>';
          setTimeout(function () { window.location.href = "/espace.html"; }, 1400);
        } else {
          statusEl.innerHTML =
            '<p class="ok">Connecté en tant que <span class="mail">' + mail + "</span>.</p>" +
            "<p>Dernière étape : les informations de votre cabinet, nécessaires à la facturation.</p>";
          actionsEl.innerHTML =
            '<a href="/cabinet.html" class="btn">Enregistrer mon cabinet →</a>';
          setTimeout(function () { window.location.href = "/cabinet.html"; }, 1800);
        }
      })
      .catch(function () {
        confirmBtn.disabled = false;
        statusEl.innerHTML = '<p class="err">Erreur de connexion. Réessayez.</p>';
      });
  });
})();
</script>
</body>
</html>
